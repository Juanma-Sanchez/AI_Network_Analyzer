auths:
  public_v2:
    community: public_v2
    version: 2
modules:
  linux_router:
    walk:
    - 1.3.6.1.2.1.1.5.0 # Identity OID
    - 1.3.6.1.2.1.2.2.1 # Interface Name OID
    - 1.3.6.1.2.1.31.1.1.1.6 # Bytes In OID
    - 1.3.6.1.2.1.31.1.1.1.10 # Bytes Out OID
    metrics:
    - name: identity
      oid: 1.3.6.1.2.1.1.5.0
      type: DisplayString
    - name: interfaceName
      oid: 1.3.6.1.2.1.2.2.1.2
      type: DisplayString
    - name: bytesIn
      oid: 1.3.6.1.2.1.31.1.1.1.6.1
      type: Counter64
    - name: bytesOut
      oid: 1.3.6.1.2.1.31.1.1.1.10.1
      type: Counter64
