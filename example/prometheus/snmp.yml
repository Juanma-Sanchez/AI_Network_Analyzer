auths:
  public_v2:
    community: public
    version: 2
modules:
  linux_router:
    walk:
    - 1.3.6.1.2.1.2.2 # Interface Table OID
    metrics:
    - name: bytesIn
      oid: 1.3.6.1.2.1.2.2.1.10
      type: Counter32
      indexes:
      - labelname: interfaceName
        type: gauge
      lookups:
      - labels:
        - interfaceName
        oid: 1.3.6.1.2.1.2.2.1.2
        labelname: interfaceName
        type: DisplayString
    - name: bytesOut
      oid: 1.3.6.1.2.1.2.2.1.16
      type: Counter32
      indexes:
      - labelname: interfaceName
        type: gauge
      lookups:
      - labels:
        - interfaceName
        oid: 1.3.6.1.2.1.2.2.1.2
        labelname: interfaceName
        type: DisplayString
    