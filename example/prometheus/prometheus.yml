scrape_configs:
  - job_name: 'snmp'
    metrics_path: /snmp
    params:
      module: 
        - linux_router
    static_configs:
      - targets:
        - R1
        - R2
        - R3
        - R4
        - R5
        - R6
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 10.0.10.96:9116  # Dirección del SNMP Exporter
      - source_labels: [__identity__]
        target_label: identity
