services:
  web:
    build:
      context: host
    image: network_analyzer_host
    hostname: "web"
    ports:
      - "8000:8000"
    command: >
      bash -c "ip route delete default && 
      ip route add default via 10.0.9.1 && 
      python -m http.server 8000"
    networks:
      internet:
        ipv4_address: 10.0.9.2
    cap_add:
    - NET_ADMIN
  H1:
    build:
      context: host
    image: network_analyzer_host
    hostname: H1
    command: >
      bash -c "ip route delete default &&
      ip route add default via 10.0.0.1 &&
      tail -f /dev/null"
    networks:
      local1:
        ipv4_address: 10.0.0.2
    cap_add:
    - NET_ADMIN
  R1:
    image: ubuntu
    hostname: R1
    command: tail -f /dev/null
    networks:
      internet:
        ipv4_address: 10.0.9.1
      local1:
        ipv4_address: 10.0.0.1
networks:
  internet:
    driver: bridge
    ipam:
      config:
        - subnet: "10.0.9.0/24"
          gateway: "10.0.9.254"
  local1:
    driver: bridge
    ipam:
      config:
        - subnet: "10.0.0.0/24"
          gateway: "10.0.0.254"